name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Secret pattern gate
        shell: bash
        run: |
          if git grep -nEI '(api[_-]?key|secret|token|password)[[:space:]]*=[[:space:]]*["'"''][^"'"'']{8,}' -- ':!*.md'; then
            echo 'Potential hard-coded secret detected.' >&2
            exit 1
          fi
