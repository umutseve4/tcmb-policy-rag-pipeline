name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tcmb-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Secret pattern gate
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          pattern = re.compile(
              r"(api[_-]?key|secret|token|password)\s*=\s*[\"'][^\"']{8,}",
              re.IGNORECASE,
          )
          findings = []
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", errors="surrogateescape"))
              if path.suffix.lower() == ".md":
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for line_number, line in enumerate(
                  data.decode("utf-8", errors="replace").splitlines(), start=1
              ):
                  if pattern.search(line):
                      findings.append(f"{path}:{line_number}")
          if findings:
              print("Potential hard-coded secret detected:", file=sys.stderr)
              print("\n".join(findings), file=sys.stderr)
              raise SystemExit(1)
          PY
